<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Structure Example</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>My Website Title</h1>
        <nav>
            <a href="#home">Home</a> | 
            <a href="#about">About</a> | 
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <article>
            <h2>Article Title</h2>
            <p>This is the main content of the web page.</p>
        </article>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
        <p>Contact: info@example.com</p>
    </footer>

</body>
</html>
