<head>
  <script>
    // Open a new window with specific dimensions and features
    var newWindow = window.open(
    'https://example.com',  // URL to open (or empty string for blank)
    'MyNewWindow',          // Name of the window (useful for targeting)
    'width=400,height=300,scrollbars=yes' // Comma-separated features
    );
    
    
    if (newWindow) {
      newWindow.focus();
    }
      </script>
</head>
